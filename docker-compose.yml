# veritas-sih2025/docker-compose.yml

services:
  veritas-model-server:
    build:
      context: .
      dockerfile: ./veritas/ml/model_server/Dockerfile
    ports:
      # CORRECTED: Maps host port 8008 to the container's port 8001
      - "8008:8001"
    volumes:
      # Mounts your local models directory into the container for the server to use
      - ./models/veritas:/app/models
      # Mounts the server code for hot-reloading
      - ./veritas/ml/model_server:/app
    command: uvicorn server:app --host 0.0.0.0 --port 8001 --reload

  veritas-backend:
    build:
      context: .
      dockerfile: ./veritas/backend/Dockerfile
    ports:
      - "8002:8000"
    environment:
      - PYTHONPATH=/app
    depends_on:
      - veritas-model-server
    volumes:
      # Mounts the backend code for hot-reloading
      - ./veritas/backend/app:/app/app
      - ./tools:/app/tools
      - ./data/reviews:/app/reviews
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload